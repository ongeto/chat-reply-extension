<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reply Assistant Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="card">
      <h1>Reply Assistant settings</h1>
      <p class="lead">
        Switch between <strong>Gemini</strong> and <strong>OpenAI</strong>. Keys stay in this browser and are only sent to the selected provider when you generate.
      </p>

      <label class="field">
        <span>Provider</span>
        <select id="provider">
          <option value="gemini">Google Gemini</option>
          <option value="openai">OpenAI</option>
        </select>
      </label>

      <div id="geminiFields" class="provider-block">
        <label class="field">
          <span>Gemini API key</span>
          <input id="geminiApiKey" type="password" autocomplete="off" placeholder="AIza…" />
        </label>
      </div>

      <div id="openaiFields" class="provider-block" hidden>
        <label class="field">
          <span>OpenAI API key</span>
          <input id="openaiApiKey" type="password" autocomplete="off" placeholder="sk-…" />
        </label>
      </div>

      <label class="field">
        <span>Model</span>
        <input
          id="model"
          type="text"
          list="modelSuggestions"
          placeholder="gemini-3-flash-preview"
          spellcheck="false"
        />
        <datalist id="modelSuggestions"></datalist>
        <small id="modelHint" class="hint">Pick from the list or paste an exact model id.</small>
      </label>

      <label class="field">
        <span>Default sender profile</span>
        <textarea id="defaultSenderProfile" rows="3" placeholder="Who you are and how you write — used as the starting sender profile."></textarea>
      </label>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
      <div id="error" class="error" role="alert" aria-live="assertive" hidden></div>

      <p class="lead">
        <a href="../logs/logs.html">Open usage logs</a>
        to review scanned inputs, generated replies, failures, and good/bad ratings.
      </p>

      <div class="btn-row">
        <button type="button" id="testBtn" class="btn secondary">Test connection</button>
        <button type="button" id="saveBtn" class="btn">Save settings</button>
      </div>
    </main>
    <script src="options.js" type="module"></script>
  </body>
</html>
